plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starfox.port'
    compileSdk 34

    defaultConfig {
        applicationId 'com.starfox.port'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-base'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
